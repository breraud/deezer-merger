[project]
name = "deezer-merger"
version = "0.1.0"
description = "Fusionne trois playlists Deezer dans une playlist cible."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.136.0",
  "uvicorn>=0.46.0",
  "deezer-python-gql>=0.9.0",
  "python-dotenv>=1.2.2",
]

[tool.uv]
# Deux modules a la racine (main.py, deezer_client.py) : rien a empaqueter.
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
